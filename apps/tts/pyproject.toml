[project]
name = "murugappan-dev-tts"
version = "0"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.0",
  "mlx-audio==0.6.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"
]

[dependency-groups]
dev = ["basedpyright==1.40.2", "ruff==0.17.1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "BLE", "I", "UP"]

[tool.basedpyright]
pythonVersion = "3.14"
# Pyright's default mode. basedpyright's "recommended" adds reportUnknown*/reportAny
# warnings that the untyped mlx-audio / mlx-whisper APIs cannot satisfy.
typeCheckingMode = "standard"
extraPaths = ["fakes"]
