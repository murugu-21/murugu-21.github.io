[project]
name = "murugappan-dev-tts"
version = "0"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.0",
  "mlx-audio==0.6.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"
]

[dependency-groups]
dev = ["ruff==0.17.2", "ty==0.0.95"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "BLE", "I", "UP"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["fakes"]
