# Qlty CLI and Qlty Cloud read this file. Reference: https://qlty.sh/d/qlty-toml
#
# Formatting, linting and unused-code checks run in CI (oxfmt, oxlint, Biome, Prettier for .astro,
# knip), so Qlty runs none of them: its Prettier ignores .astro and disagrees with oxfmt everywhere
# else, its knip can't load this repo's config, and its Biome would only repeat CI.
config_version = "0"

exclude_patterns = ["**/node_modules/**", "**/dist/**", "**/*.d.ts", "**/*.min.*"]

test_patterns = ["**/test/**", "**/*.test.*"]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "zizmor"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "osv-scanner"

# The Python TTS helpers under apps/tts.
[[plugin]]
name = "ruff"
drivers = ["lint"]

[[plugin]]
name = "bandit"
