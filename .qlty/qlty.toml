# Reference: https://qlty.sh/d/qlty-toml
# CI runs formatting, lint and unused-code checks, so Qlty runs none: its Prettier disagrees
# with oxfmt, its knip can't load this repo's config, and its Biome would only repeat CI.
config_version = "0"

exclude_patterns = ["**/node_modules/**", "**/dist/**", "**/*.d.ts", "**/*.min.*"]

test_patterns = ["**/test/**", "**/*.test.*"]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "zizmor"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "ruff"
drivers = ["lint"]

[[plugin]]
name = "bandit"
