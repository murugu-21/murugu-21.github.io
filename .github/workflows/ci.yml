name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    # id-token lets the Qlty step authenticate by OIDC instead of a stored token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Bun runs the scripts; Node runs Astro, Vitest, cf and tsc (README "Bun and Node").
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run types
      - run: bun run check-format
      - run: bun run lint
      - run: bun run knip
      - run: bun run check:astro
      - run: bun run check:src
      - run: bun run check:worker
      # The headless shell is all the "browser" Vitest project needs.
      - run: bunx playwright install --with-deps --only-shell chromium
      # Not `bun test`, which is Bun's own runner rather than Vitest's Workers pool.
      - run: bun run test --coverage
      - uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          files: coverage/lcov.info
      # The whole site, resume PDF included (astro.config.ts build-artifacts).
      - run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
