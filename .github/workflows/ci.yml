name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Bun runs the scripts; Node still runs Wrangler and tsc (README "Bun and Node").
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Secrets live in gitignored .dev.vars locally; wrangler types needs the
      # keys present so the generated Env includes them.
      - run: printf 'OPPORTUNITY_INBOX=ci@example.com\nDEEPSEEK_API_KEY=placeholder-key\n' > .dev.vars
      - run: bunx wrangler types
      - run: bun run check-format
      - run: bun run lint
      - run: bun run check:astro
      - run: bun run check:src
      - run: bun run check:worker
      # Not `bun test`, which is Bun's own runner rather than Vitest's Workers pool.
      - run: bun run test
      # The whole site, resume PDF included (astro.config.ts build-artifacts).
      - run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
