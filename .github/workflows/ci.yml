name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Bun installs dependencies and runs the package scripts; Node stays the
      # runtime for Astro, Wrangler and the Workers Vitest pool (see README
      # "Development").
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Secrets live in gitignored .dev.vars locally; wrangler types needs the
      # keys present so the generated Env includes them.
      - run: printf 'OPPORTUNITY_INBOX=ci@example.com\nDEEPSEEK_API_KEY=placeholder-key\n' > .dev.vars
      - run: bunx wrangler types
      - run: bun run check-format
      - run: bun run lint
      - run: bun run check:astro
      - run: bun run check:src
      - run: bun run check:worker
      # `bun run test`, not `bun test` — the latter is Bun's own runner, and the
      # suite must run under Vitest's Workers pool.
      - run: bun run test
      - run: bun run build:site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
