name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
      - uses: ./.github/actions/setup
      - run: bun run check:static
  test-and-build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: uv sync --locked --project apps/tts
      - run: bunx playwright install --with-deps --only-shell chromium
      # Not `bun test`, which is Bun's own runner, not Vitest.
      - run: bun run test --coverage
      - uses: qltysh/qlty-action/coverage@0ff2178667bf8eb28ed0013a7ef54857a24d4056 # v2.7.0
        with:
          oidc: true
          # Off by default since v2.7.0. Keeps the pre-upgrade behaviour: no telemetry from CI.
          telemetry: false
          files: coverage/lcov.info
      - run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run test:e2e
