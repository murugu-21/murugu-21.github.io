name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - uses: ./.github/actions/setup
      - run: bun run types
      - run: bun run check-format
      - run: bun run lint
      - run: bun run knip
      - run: bun run check:src
      - run: bun run check:worker
      - run: bun run check:effect
      - run: bun run check:py
  test-and-build:
    # Tests and the build ran slower on arm64 (run 38265573874).
    runs-on: ubuntu-26.04
    # id-token lets the Qlty step authenticate by OIDC instead of a stored token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The read-aloud contract tests run in this venv (apps/tts/fakes/README.md).
      - run: uv sync --locked --project apps/tts
      # The headless shell is all the "browser" Vitest project needs.
      - run: bunx playwright install --with-deps --only-shell chromium
      # Not `bun test`, which is Bun's own runner, not Vitest.
      - run: bun run test --coverage
      - uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          files: coverage/lcov.info
      # The whole site, resume PDF included (astro.config.ts build-artifacts).
      - run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
