# Weekly link check (.github/workflows/links.yml) over the repo's markdown.
extensions = ["md"]

# READMEs point at the dev server.
exclude_loopback = true

# Bot protection on these hosts answers 403 to non-browser clients or CI runner IPs.
exclude = [
  '^https://stackoverflow\.com/',
  '^https://medium\.com/',
  '^https://www\.npmjs\.com/',
  '^https://x\.com/',
]
