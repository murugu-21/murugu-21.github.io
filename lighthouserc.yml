ci:
  collect:
    settings:
      # Lighthouse rejects robots.txt's Content-Signal line (contentsignals.org) as an
      # unknown directive; crawlers skip lines they don't know, so it stays.
      skipAudits: [robots-txt]
  assert:
    assertions:
      categories:performance: [error, { minScore: 0.97, aggregationMethod: median-run }]
      categories:accessibility: [error, { minScore: 1, aggregationMethod: median-run }]
      categories:best-practices: [error, { minScore: 1, aggregationMethod: median-run }]
      categories:seo: [error, { minScore: 1, aggregationMethod: median-run }]
